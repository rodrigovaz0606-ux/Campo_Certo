services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campo-certo
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      JWT_SECRET: ${JWT_SECRET:-altere-esta-chave-antes-de-publicar}
    volumes:
      - produtor_rural_data:/app/data

volumes:
  produtor_rural_data:
    name: produtor-rural-data
